name: batch

# Generic batch runner for open-source segmentation models (rembg) on free
# runners. Inputs live at data/<run-id>/payload.zip (a plain zip of images),
# committed before the run. Trigger via repository_dispatch (event: batch)
# with a job payload, or manually with workflow_dispatch + a `job` JSON input.
#
# job JSON contract:
#   {"id": "run-001",
#    "models": ["isnet-anime", "birefnet-general"],      # optional
#    "upscale": {"factor": 4}}                           # optional RealESRGAN xN pre-pass
#
# When upscale.factor > 0 an extra job runs BEFORE the matting legs: it upscales
# every input with RealESRGAN_x4plus_anime_6B (spandrel, torch CPU) and uploads
# the results as the `upscale-<run-id>` artifact; matting legs consume those
# instead and also publish them to results/<run-id>/upscale/ for inspection.
#
# One job per model (matrix, fail-fast: false) so a runner preemption only
# kills one leg; results travel as artifacts; a final publish job commits
# everything to the `out` branch under results/<run-id>/<model>/raw_<stem>.png.

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'JSON payload (see contract above)'
        required: false
        default: ''
  repository_dispatch:
    types: [batch]

permissions:
  contents: write

concurrency:
  group: batch
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.plan.outputs.run_id }}
      matrix: ${{ steps.plan.outputs.matrix }}
      upscale: ${{ steps.plan.outputs.upscale }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write job payload
        env:
          JOB_JSON: ${{ github.event.client_payload.job && toJSON(github.event.client_payload.job) || github.event.inputs.job }}
        run: |
          printf '%s' "$JOB_JSON" > job.json
          cat job.json

      - id: plan
        run: |
          RUN_ID=$(python3 -c "import json;print(json.load(open('job.json'))['id'])")
          MODELS=$(python3 -c "import json;m=json.load(open('job.json')).get('models');print(json.dumps({'model': m}) if m else '')")
          if [ -z "$MODELS" ]; then
            MODELS='{"model":["isnet-anime","birefnet-general-lite","birefnet-general","birefnet-massive"]}'
          fi
          UP=$(python3 -c "import json;print((json.load(open('job.json')).get('upscale') or {}).get('factor', 0) or 0)")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "matrix=$MODELS" >> "$GITHUB_OUTPUT"
          echo "upscale=$UP" >> "$GITHUB_OUTPUT"

      - name: Upload job metadata
        uses: actions/upload-artifact@v4
        with:
          name: batch-meta
          path: job.json
          retention-days: 7

  upscale:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      factor: ${{ needs.plan.outputs.upscale }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install torch (CPU) + spandrel
        if: needs.plan.outputs.upscale != '0'
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install spandrel pillow numpy

      - name: Unpack inputs
        run: |
          ID="${{ needs.plan.outputs.run_id }}"
          mkdir -p "data/${ID}/in"
          unzip -o "data/${ID}/payload.zip" -d "data/${ID}/in"

      - name: Download RealESRGAN weights
        if: needs.plan.outputs.upscale != '0'
        run: |
          curl -L --fail --retry 3 -o /tmp/RealESRGAN_x4plus_anime_6B.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
          ls -la /tmp/RealESRGAN_x4plus_anime_6B.pth

      - name: Upscale x${{ needs.plan.outputs.upscale }}
        if: needs.plan.outputs.upscale != '0'
        run: |
          ID="${{ needs.plan.outputs.run_id }}"
          python3 scripts/upscale.py "data/${ID}/in" "data/${ID}/upscaled" \
            "${{ needs.plan.outputs.upscale }}" /tmp/RealESRGAN_x4plus_anime_6B.pth

      - name: Marker for skipped upscale
        if: needs.plan.outputs.upscale == '0'
        run: |
          ID="${{ needs.plan.outputs.run_id }}"
          mkdir -p "data/${ID}/upscaled"
          echo "upscale disabled for this run" > "data/${ID}/upscaled/SKIPPED.txt"

      - name: Upload upscaled inputs
        uses: actions/upload-artifact@v4
        with:
          name: upscale-${{ needs.plan.outputs.run_id }}
          path: data/${{ needs.plan.outputs.run_id }}/upscaled
          if-no-files-found: error

  batch:
    needs: [plan, upscale, publish-meta]
    if: always() && !cancelled() && needs.plan.outputs.run_id != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rembg
        run: |
          python -m pip install --upgrade pip
          pip install "rembg[cpu]==2.0.81" pillow numpy

      - name: Download upscaled inputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: upscale-${{ needs.plan.outputs.run_id }}
          path: data/${{ needs.plan.outputs.run_id }}/in_up

      - name: Choose input dir
        id: indir
        run: |
          ID="${{ needs.plan.outputs.run_id }}"
          IN_DIR="data/${ID}/in"
          if [ -d "data/${ID}/in_up" ] && [ -n "$(ls -A data/${ID}/in_up 2>/dev/null)" ] && [ ! -f "data/${ID}/in_up/SKIPPED.txt" ]; then
            IN_DIR="data/${ID}/in_up"
            mkdir -p "data/${ID}/out/upscale"
            cp -r "data/${ID}/in_up/." "data/${ID}/out/upscale/"
          fi
          echo "dir=$IN_DIR" >> "$GITHUB_OUTPUT"
          echo "input: $IN_DIR ($(ls "$IN_DIR" | wc -l) files)"

      - name: Unpack raw inputs (fallback / non-upscaled runs)
        run: |
          ID="${{ needs.plan.outputs.run_id }}"
          mkdir -p "data/${ID}/in"
          unzip -o "data/${ID}/payload.zip" -d "data/${ID}/in"

      - name: Runner resources
        run: echo "cores=$(nproc)" && free -h

      - name: Process (${{ matrix.model }})
        run: |
          ID="${{ needs.plan.outputs.run_id }}"
          python3 scripts/process.py --worker "${{ matrix.model }}" \
            "${{ steps.indir.outputs.dir }}" "data/${{ needs.plan.outputs.run_id }}/out/${{ matrix.model }}"

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ needs.plan.outputs.run_id }}-${{ matrix.model }}
          path: data/${{ needs.plan.outputs.run_id }}/out
          if-no-files-found: warn

  # publish-meta exists only to give `batch` a needs target that always
  # succeeds (upscale is skipped for non-upscaled runs and a skipped need
  # would skip the matrix legs by default).
  publish-meta:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - run: echo "meta ok — run ${{ needs.plan.outputs.run_id }}"

  publish:
    needs: [plan, batch]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && needs.batch.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: batch-${{ needs.plan.outputs.run_id }}-*
          merge-multiple: true
          path: assemble

      - name: Download job metadata
        uses: actions/download-artifact@v4
        with:
          pattern: batch-meta
          path: meta

      - name: Publish to out branch
        run: |
          RUN_ID="${{ needs.plan.outputs.run_id }}"
          STAGE=/tmp/batch_publish
          rm -rf "$STAGE"
          mkdir -p "$STAGE/results/${RUN_ID}"
          cp -r assemble/. "$STAGE/results/${RUN_ID}/"
          JOB_JSON_FILE=$(find meta -name job.json | head -1)
          cp "$JOB_JSON_FILE" "$STAGE/results/${RUN_ID}/job.json"
          ls -laR "$STAGE"

          git config user.name "batch-bot"
          git config user.email "batch-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin out >/dev/null 2>&1; then
            git fetch --no-tags origin out
            git switch -C out FETCH_HEAD
          else
            git switch --orphan out
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p results
          cp -r "$STAGE/results/." results/
          git add -A results
          git commit -m "batch ${RUN_ID} (${GITHUB_RUN_ID})"
          git push origin out
